# demo.gardanos.ir — فقط برای گرفتن گواهی اول (ACME روی http). بعد nginx.conf جایش می‌آید.
server {
    listen 80;
    listen [::]:80;
    server_name demo.gardanos.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; }
    location / { return 404; }
}

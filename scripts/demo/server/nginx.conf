# demo.gardanos.ir — دموی عمومی گردانوس (nextshop با DEMO_MODE=1 روی 127.0.0.1:3050، pm2 gardanos-demo)
# مسیر روی سرور: /etc/nginx/sites-available/gardanos-demo ← لینک در sites-enabled
# راهنما: docs/plans/demo.md بخش «استقرار»

# سقف درخواست هر IP — دمو عمومی است و هر کس مدیر کامل است
limit_req_zone $binary_remote_addr zone=gardanos_demo:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name demo.gardanos.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; }
    location / { return 301 https://demo.gardanos.ir$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.gardanos.ir;

    ssl_certificate     /etc/letsencrypt/live/demo.gardanos.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.gardanos.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # در دمو فقط عکس تا ۱ مگ پذیرفته می‌شود (lib/demo)؛ کمی جا برای سربار فرم
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        alias /var/www/gardanos-demo/.next/static/;
        expires 1y;
        access_log off;
    }
    location /assets/ {
        alias /var/www/gardanos-demo/public/assets/;
        expires 30d;
    }
    # آپلودهای بازدیدکننده هرگز اجرا نشوند (SVG و HTML در دمو رد می‌شوند؛ این لایه‌ی دوم است)
    location /uploads/ {
        alias /var/www/gardanos-demo/public/uploads/;
        expires 1d;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=gardanos_demo burst=60 nodelay;
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # پاسخ جریانی (SSE) بافر نشود
        proxy_buffering off;
    }
}

<h2 class="toc-header" id="مقدمه"><a href="#مقدمه" class="toc-anchor">¶</a> 📖 مقدمه</h2>
<p><strong>سرویس‌هاب</strong> زیرساخت Open API دیجی‌کالا برای فروشندگان مارکت‌پلیس است. این پلتفرم بر پایه OAuth 2.0 ساخته شده و به اپلیکیشن‌های third-party اجازه می‌دهد با کسب رضایت صریح از فروشنده، به داده‌ها و عملیات پنل فروشندگی دسترسی پیدا کنند.</p>

<h2 class="toc-header" id="️-پیشنیازها"><a href="#️-پیشنیازها" class="toc-anchor">¶</a> ⚙️ پیش‌نیازها</h2>
<p>قبل از شروع، موارد زیر را آماده کنید:</p>
<p><strong>۱. ثبت‌نام اپلیکیشن</strong> — اپلیکیشن شما باید توسط تیم دیجی‌کالا تأیید شده باشد. پس از تأیید، یک <code>client_code</code> منحصربه‌فرد دریافت خواهید کرد.</p>
<p><strong>۲. جفت کلید RSA (4096-bit)</strong> — پلتفرم authorization code را با کلید عمومی شما رمزگذاری می‌کند. برای تولید کلید و فرمت مورد نیاز (PKCS#8) به <a class="is-internal-link is-valid-page" href="/fa/%D8%B1%D8%A7%D9%87%D9%86%D9%85%D8%A7%DB%8C-%DB%8C%DA%A9%D9%BE%D8%A7%D8%B1%DA%86%D9%87-%D8%B3%D8%A7%D8%B2%DB%8C">راهنمای احراز هویت — بخش ایجاد کلیدهای RSA</a> مراجعه کنید.</p>
<blockquote>
<p>⚠️ فایل کلید خصوصی را هرگز در repository کامیت نکنید و دسترسی فایل‌سیستم آن را محدود کنید (<code>chmod 600 private_pkcs8.pem</code>).</p>
</blockquote>
<hr>
<h2 class="toc-header" id="مرور-کلی-جریان-احراز-هویت"><a href="#مرور-کلی-جریان-احراز-هویت" class="toc-anchor">¶</a> 🔄 مرور کلی جریان احراز هویت</h2>
<div dir="ltr">
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">App  ──▶  Redirect to consent page  ──▶  Seller approves
 │
 ▼
Receive encrypted authorization_code in callback URL
 │
 ▼
Decrypt with RSA private key (PKCS#1 v1.5 padding)
 │
 ▼
POST /open-api/v1/auth/token  ──▶  Receive access_token + refresh_token
 │
 ▼
Call API with  Authorization: Bearer &lt;access_token&gt;
</code></pre>
</div>
<hr>
<h2 class="toc-header" id="مرحله-۱-هدایت-فروشنده-به-صفحه-رضایت"><a href="#مرحله-۱-هدایت-فروشنده-به-صفحه-رضایت" class="toc-anchor">¶</a> 🔗 مرحله ۱: هدایت فروشنده به صفحه رضایت</h2>
<p>فروشنده را به URL زیر ریدایرکت کنید تا مجوز دسترسی اپلیکیشن را تأیید کند:</p>
<div dir="ltr">
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">https://seller.digikala.com/pwa/seller-services/consents
  ?client_code=YOUR_CLIENT_CODE
  &amp;scopes=profile.read,order.read
  &amp;redirect_uri=https://yourapp.com/callback
  &amp;state=RANDOM_CSRF_TOKEN
</code></pre>
</div>
<h3 class="toc-header" id="پارامترها"><a href="#پارامترها" class="toc-anchor">¶</a> پارامترها</h3>
<div class="table-container"><table>
<thead>
<tr>
<th>پارامتر</th>
<th>اجباری</th>
<th>توضیح</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>client_code</code></td>
<td>بله</td>
<td>کد اپلیکیشن دریافت‌شده هنگام ثبت‌نام</td>
</tr>
<tr>
<td><code>scopes</code></td>
<td>بله</td>
<td>لیست دسترسی‌های مورد نیاز، با کاما جدا شده</td>
</tr>
<tr>
<td><code>redirect_uri</code></td>
<td>بله</td>
<td>آدرس callback که پس از تأیید فروشنده ریدایرکت می‌شود</td>
</tr>
<tr>
<td><code>state</code></td>
<td>توصیه می‌شود</td>
<td>رشته تصادفی برای جلوگیری از CSRF</td>
</tr>
</tbody>
</table></div>
<blockquote>
<p>لیست کامل scope‌های موجود را در <a class="is-internal-link is-valid-page" href="/fa/%D8%B1%D8%A7%D9%87%D9%86%D9%85%D8%A7%DB%8C-%DB%8C%DA%A9%D9%BE%D8%A7%D8%B1%DA%86%D9%87-%D8%B3%D8%A7%D8%B2%DB%8C">راهنمای احراز هویت — بخش Scope‌ها</a> ببینید.</p>
</blockquote>

<h2 class="toc-header" id="مرحله-۲-دریافت-و-رمزگشایی-کد"><a href="#مرحله-۲-دریافت-و-رمزگشایی-کد" class="toc-anchor">¶</a> 🔓 مرحله ۲: دریافت و رمزگشایی کد</h2>
<p>پس از تأیید فروشنده، دیجی‌کالا به <code>redirect_uri</code> شما ریدایرکت می‌کند:</p>
<div dir="ltr">
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">https://yourapp.com/callback?code=ENCRYPTED_CODE&amp;state=RANDOM_CSRF_TOKEN
</code></pre>
</div>
<p>مقدار <code>code</code> با ترتیب <strong>URL-encode ← Base64 ← RSA(PKCS#1 v1.5)</strong> رمزگذاری شده است. مراحل رمزگشایی:</p>
<ol>
<li>مقدار <code>code</code> را از query string استخراج کنید</li>
<li>آن را <strong>URL-decode</strong> کنید</li>
<li>نتیجه را <strong>Base64-decode</strong> کنید</li>
<li>خروجی را با کلید خصوصی RSA و padding از نوع <strong>PKCS#1 v1.5</strong> رمزگشایی کنید</li>
</ol>
<blockquote>
<p>نمونه کد رمزگشایی در تمام زبان‌های برنامه‌نویسی پشتیبانی‌شده را در <a class="is-internal-link is-valid-page" href="/fa/%D8%B1%D8%A7%D9%87%D9%86%D9%85%D8%A7%DB%8C-%DB%8C%DA%A9%D9%BE%D8%A7%D8%B1%DA%86%D9%87-%D8%B3%D8%A7%D8%B2%DB%8C">راهنمای احراز هویت — بخش رمزگشایی</a> ببینید.</p>
</blockquote>
<hr>
<h2 class="toc-header" id="️-مرحله-۳-دریافت-توکن"><a href="#️-مرحله-۳-دریافت-توکن" class="toc-anchor">¶</a> 🎟️ مرحله ۳: دریافت توکن</h2>
<p>پس از رمزگشایی کد، آن را با access_token تبادل کنید:</p>
<div dir="ltr">
<pre class="prismjs line-numbers" v-pre="true"><code class="language-http">POST /open-api/v1/auth/token
Host: seller.digikala.com
Content-Type: application/json

{
  "authorization_code": "DECRYPTED_CODE_FROM_PREVIOUS_STEP"
}
</code></pre>
</div>

<h2 class="toc-header" id="هدر-الزامی-user-agent"><a href="#هدر-الزامی-user-agent" class="toc-anchor">¶</a> 🔤 هدر الزامی: User-Agent</h2>
<p>علاوه بر هدر <code>Authorization</code>، تمام درخواست‌هایی که به Open API سرویس‌هاب ارسال می‌کنید باید هدر <code>User-Agent</code> را هم با فرمت مشخص زیر داشته باشند؛ در غیر این صورت درخواست شما رد می‌شود.</p>
<p><strong>برای سرویس دهنده ها:</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">User-Agent: DigikalaTrustedBot/{service_name}
</code></pre>
<p><code>{service_name}</code> را با نام انگلیسی اپلیکیشن/سرویس خودتان جایگزین کنید (بدون فاصله). برای مثال، اگر نام سرویس شما «MyAwesomeApp» باشد:</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">User-Agent: DigikalaTrustedBot/MyAwesomeApp
</code></pre>
<p><strong>برای توکن های شخصی:</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">User-Agent: DigikalaTrustedBot/SelfToken/{seller_id}
</code></pre>
<p><code>{seller_id}</code> را با نام کد فروشندگی خودتان جایگزین کنید. برای مثال، اگر کد فروشندگی شما «12345» باشد:</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">User-Agent: DigikalaTrustedBot/SelfToken/12345
</code></pre>
<p>مثال کامل درخواست:</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-http">GET /open-api/v1/profile?mini=true
Host: seller.digikala.com
Authorization: Bearer &lt;access_token&gt;
User-Agent: DigikalaTrustedBot/SelfToken/12345
</code></pre>
<p>⚠️ <strong>خطاهای رایج که باعث رد شدن درخواست می‌شوند:</strong></p>
<ul>
<li>عدم ارسال هدر <code>User-Agent</code> (خیلی از کتابخانه‌های HTTP این هدر را با مقدار پیش‌فرض خودشان می‌فرستند، مثل <code>curl/8.x</code> یا <code>PostmanRuntime/7.x</code>، که مورد قبول نیست)</li>
<li>ننوشتن پیشوند <code>DigikalaTrustedBot/</code></li>
<li>استفاده از <code>/</code> اشتباه یا فاصله‌ی اضافه بین <code>DigikalaTrustedBot</code> و نام سرویس</li>
<li>نوشتن نام سرویس به فارسی یا با کاراکترهای غیرمجاز</li>
</ul>
<p>اگر هدر <code>User-Agent</code> ارسال نشود یا با این فرمت مطابقت نداشته باشد، سرور با خطای زیر پاسخ می‌دهد:</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-http">HTTP/1.1 401 Unauthorized
</code></pre>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-json">{
    "status": "error",
    "message": "user-agent is invalid",
    "code": 401
}
</code></pre>
<h2 class="toc-header" id="تمدید-توکن"><a href="#تمدید-توکن" class="toc-anchor">¶</a> 🔁 تمدید توکن</h2>
<p><code>access_token</code> پس از ۲ ساعت منقضی می‌شود. از <code>refresh_token</code> برای دریافت توکن جدید بدون نیاز به ریدایرکت مجدد فروشنده استفاده کنید:</p>
<div dir="ltr">
<pre class="prismjs line-numbers" v-pre="true"><code class="language-http">POST /open-api/v1/auth/refresh-token
Host: seller.digikala.com
Content-Type: application/json

{
  "access_token":  "&lt;expired-or-valid-access-token&gt;",
  "refresh_token": "&lt;refresh-token&gt;"
}
</code></pre>
</div>
<blockquote>
<p>پس از هر refresh، <strong>هر دو توکن</strong> به‌روز می‌شوند. توکن‌های قدیمی را دور بیندازید.</p>
<p>برای پیاده‌سازی TokenManager (refresh خودکار پیش از انقضا) در تمام زبان‌ها به <a class="is-internal-link is-valid-page" href="/fa/%D8%B1%D8%A7%D9%87%D9%86%D9%85%D8%A7%DB%8C-%DB%8C%DA%A9%D9%BE%D8%A7%D8%B1%DA%86%D9%87-%D8%B3%D8%A7%D8%B2%DB%8C">راهنمای احراز هویت — بخش Refresh</a> مراجعه کنید.</p>
</blockquote>

<h2 class="toc-header" id="️-مدیریت-خطاها"><a href="#️-مدیریت-خطاها" class="toc-anchor">¶</a> ⚠️ مدیریت خطاها</h2>
<div class="table-container"><table>
<thead>
<tr>
<th>کد HTTP</th>
<th>معنی</th>
<th>راه‌حل</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>401</code></td>
<td>توکن منقضی یا نامعتبر</td>
<td><code>refresh_token</code> را فراخوانی کنید</td>
</tr>
<tr>
<td><code>403</code></td>
<td>دسترسی کافی ندارید</td>
<td>اسکوپ‌های لازم را بررسی و در صورت نیاز مجدداً consent بگیرید</td>
</tr>
<tr>
<td><code>404</code></td>
<td>منبع یافت نشد</td>
<td>شناسه endpoint یا resource را بررسی کنید</td>
</tr>
<tr>
<td><code>422</code></td>
<td>داده ارسالی نامعتبر</td>
<td>پیام خطا و مستندات endpoint مربوطه را بررسی کنید</td>
</tr>
<tr>
<td><code>429</code></td>
<td>محدودیت نرخ درخواست</td>
<td>با exponential backoff مجدداً تلاش کنید — <a class="is-internal-link is-valid-page" href="/fa/rate-limits">مستندات Rate Limiting</a></td>
</tr>
<tr>
<td><code>500</code></td>
<td>خطای داخلی سرور</td>
<td>مجدداً تلاش کنید؛ اگر ادامه داشت با پشتیبانی تماس بگیرید</td>
</tr>
</tbody>
</table></div>
